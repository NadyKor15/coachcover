<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>CoachCover — Cover case</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/status.css">
<link rel="stylesheet" href="assets/case.css">
</head>
<body data-state="loading">
<div class="app">
  <aside class="side">
    <svg class="logo" viewBox="0 0 212 44" role="img" aria-label="CoachCover"><text x="1" y="37" fill="#08665C" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="700" letter-spacing="-1">CoachCover</text></svg>
    <ul class="nav">
      <li data-href="index.html"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 9.5h18"/></svg><span class="lbl">Today</span></li>
      <li data-href="week.html"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 9.5h18"/><path d="M7.5 13.5h.01M12 13.5h.01M16.5 13.5h.01M7.5 17h.01M12 17h.01M16.5 17h.01" stroke-width="2.6"/></svg><span class="lbl">Week ahead</span></li>
      <li class="wide" data-href="staff.html"><svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16.5" rx="2"/><path d="M12 2.2v2.3"/><circle cx="12" cy="10.8" r="2.8"/><path d="M7.2 18.5c.6-2.4 2.5-3.6 4.8-3.6s4.2 1.2 4.8 3.6"/></svg><span class="lbl">Staff &amp; Certificates</span></li>
      <li class="active" data-href="case.html"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2.5"/><path d="M7.5 8h.01M7.5 12h.01M7.5 16h.01" stroke-width="2.8"/><path d="M11 8h6M11 12h6M11 16h6" stroke-width="2.4"/></svg><span class="lbl">Cases</span></li>
      <li data-href="network.html"><svg viewBox="0 0 24 24"><circle cx="16" cy="5" r="3"/><circle cx="5" cy="18.5" r="3"/><circle cx="19" cy="18.5" r="3"/><path d="M14.2 7.4 6.8 16M8 18.5h8"/></svg><span class="lbl">Network</span></li>
      <li id="navReports" data-href="/api/binder.pdf" data-blank><svg viewBox="0 0 24 24"><path d="M6.5 20.5v-6M12 20.5V10M17.5 20.5V4" stroke-width="3"/></svg><span class="lbl">Reports</span></li>
    </ul>
  </aside>

  <div class="main">
    <div class="load-err" id="loadErr" role="alert" hidden></div>
    <header class="top">
      <div class="tg tg1">
        <svg width="37" height="26" viewBox="0 0 37 26" stroke="#0E6B60" stroke-width="2.7" style="position:relative;top:1px"><path d="M2 4.2c2.2-2.3 4.4-2.3 6.6 0s4.4 2.3 6.6 0 4.4-2.3 6.6 0 4.4 2.3 6.6 0 4.4-2.3 6.6 0"/><path d="M2 13c2.2-2.3 4.4-2.3 6.6 0s4.4 2.3 6.6 0 4.4-2.3 6.6 0 4.4 2.3 6.6 0 4.4-2.3 6.6 0"/><path d="M2 21.8c2.2-2.3 4.4-2.3 6.6 0s4.4 2.3 6.6 0 4.4-2.3 6.6 0 4.4 2.3 6.6 0 4.4-2.3 6.6 0"/></svg>
        <span class="facility" data-slot="facility"></span>
      </div>
      <span class="tdiv"></span>
      <div class="tg tg2">
        <svg width="31" height="31" viewBox="0 0 24 24" stroke="#15181D" stroke-width="1.9" style="margin-left:-4px"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 9.5h18"/></svg>
        <span class="tdate" data-slot="date"></span>
      </div>
      <span class="tdiv"></span>
      <div class="tg tg3">
        <svg width="23" height="26" viewBox="0 0 23 26" stroke="#15181D" stroke-width="2.1"><circle cx="11.5" cy="7.5" r="5.5"/><path d="M2 24.5c0-5.3 4.2-8.5 9.5-8.5s9.5 3.2 9.5 8.5z"/></svg>
        <span class="tuser" data-slot="user"></span>
      </div>
    </header>

    <section class="card head">
      <h1 class="case-title">Case <span data-slot="case-id"></span> · <span data-slot="case-shift"></span></h1>
      <span class="pill" id="pill"><span data-slot="status"></span><span id="pillSep">&nbsp;·&nbsp;</span><span data-slot="covered-time"></span></span>
      <a class="btn" id="download" data-slot="download-case" aria-disabled="true" style="display:none"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>Download case (JSON)</a>
    </section>

    <div class="cols">
      <section class="card record" aria-label="Step record">
        <span class="rail" id="rail"></span>
        <div id="steps"></div>
      </section>

      <div class="rcol">
        <section class="card proof">
          <h2>Proof</h2>
          <img class="stamp" src="assets/proof-stamp.png" alt="" aria-hidden="true">
          <ul class="facts">
            <li class="hash" id="factHash">Plan hash <span data-slot="plan-hash"></span></li>
            <li id="factPolicy">Policy: <span data-slot="policy"></span></li>
            <li>Models: <span data-slot="models-calls"></span><span id="costSep"> · </span><span data-slot="models-cost"></span></li>
          </ul>
          <table class="calls"><tbody id="calls"></tbody></table>
        </section>

        <section class="card risk" id="risk" hidden>
          <h2>If nobody had accepted</h2>
          <p><span id="riskKids"><span data-slot="risk-kids"></span> kids</span><span id="riskRefunds"><span class="rsep"> · </span>refunds <span data-slot="risk-refunds"></span></span><span id="riskOvertime"><span class="rsep"> · </span>overtime <span data-slot="risk-overtime"></span></span><span id="riskTotal"><span class="rsep"> · </span><span data-slot="risk-total"></span> at risk</span></p>
          <p class="risk-src" data-slot="risk-source" hidden></p>
        </section>
      </div>
    </div>

    <footer class="foot"><p data-slot="footer-line">CoachCover</p></footer>
  </div>
</div>

<script src="assets/api.js"></script>
<script src="assets/case.js"></script>
</body>
</html>
