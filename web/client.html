  <main class="card" data-slot="question-card">
    <div class="offer-head">
      <svg class="badge" viewBox="0 0 132 132" aria-hidden="true">
        <circle cx="66" cy="66" r="66" fill="var(--gold-soft)"/>

      </svg>
      <h1 class="ask" data-slot="question"></h1>
    </div>

    <ul class="facts">
      <li class="fact">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--pin)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg>

      </li>
      <li class="fact">
        <svg viewBox="89 373 33 42" aria-hidden="true"><path fill="var(--pin)" fill-rule="evenodd" d="M105.3 414.6 C100.5 408.2 89.5 400 89.5 390 A15.8 15.8 0 0 1 121.1 390 C121.1 400 110.1 408.2 105.3 414.6 Z M105.4 382.1 A7.2 7.2 0 1 0 105.4 396.5 A7.2 7.2 0 1 0 105.4 382.1 Z"/></svg>

        <svg viewBox="0 0 24 24" fill="none" stroke="var(--pin)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7.5" r="4"/><path d="M4.5 21v-.8a6 6 0 0 1 6-6h3a6 6 0 0 1 6 6v.8"/></svg>
        <span class="fact-text" data-slot="lesson"></span>
      </li>
      <li class="fact" data-slot="instead-row" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--pin)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h15l-4-4M20 16H5l4 4"/></svg>
        <span class="fact-text">Instead of <span data-slot="instead-of"></span></span>
      </li>
    </ul>

    <div class="rule rule-1"></div>

    <h2 class="why-title">Messages</h2>
    <ol class="thread" data-slot="thread"></ol>
  </main>

  <footer class="actions">
    <p class="answer-by" id="answerBy" hidden>Please answer by <span data-slot="answer-by"></span></p>
    <div class="buttons" id="buttons" hidden>
      <button class="btn btn-accept" type="button" data-action="yes">Yes</button>
      <button class="btn btn-decline" type="button" data-action="no">No</button>
    </div>
    <div class="result" id="result" role="status" hidden></div>
    <p class="sent-by" data-slot="sent-by">Sent by CoachCover for <span data-slot="manager-name"></span>, <span data-slot="manager-role"></span></p>
  </footer>
</div>

<script src="assets/api.js"></script>
