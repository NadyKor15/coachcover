<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=430, initial-scale=1">
<title>CoachCover — Shift offer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/status.css">
<link rel="stylesheet" href="assets/offer.css">
</head>
<body data-state="loading">
<div class="load-err" id="loadErr" role="alert" hidden></div>
<div class="screen" data-screen="shift-offer">
  <header class="top">
    <a class="brand" href="#" aria-label="CoachCover">
      <svg class="brand-mark" viewBox="71.5 38.5 86 38" aria-hidden="true">
        <path fill="var(--brand-mark)" d="M80.7 51.3 L81.5 50.8 L84.5 48.3 L87.5 45.7 L90.5 43.7 L93.5 42.1 L96.5 41.1 L99.5 40.4 L102.5 40.3 L105.5 40.3 L108.5 40.5 L111.5 41.3 L114.5 42.1 L117.5 43.3 L120.5 44.7 L123.5 46.1 L126.5 47.7 L129.5 49.0 L132.5 50.0 L135.5 50.5 L138.5 51.2 L141.5 51.2 L144.5 50.7 L147.5 50.1 L150.5 49.0 L153.5 47.6 L156.5 45.9 L157.3 46.3 L156.5 46.7 L153.5 49.7 L150.5 52.7 L147.5 55.1 L144.5 57.0 L141.5 58.1 L138.5 58.8 L135.5 59.5 L132.5 59.6 L129.5 59.1 L126.5 58.4 L123.5 57.4 L120.5 56.3 L117.5 54.9 L114.5 53.1 L111.5 51.5 L108.5 50.3 L105.5 49.1 L102.5 48.6 L99.5 47.8 L96.5 47.8 L93.5 48.1 L90.5 48.6 L87.5 49.4 L84.5 50.5 L81.5 51.8 Z"/>
        <path fill="var(--brand-mark)" d="M71.7 67.3 L72.5 66.8 L75.5 64.3 L78.5 61.4 L81.5 59.3 L84.5 57.8 L87.5 56.7 L90.5 56.2 L93.5 55.5 L96.5 55.5 L99.5 55.9 L102.5 56.4 L105.5 57.4 L108.5 58.6 L111.5 60.0 L114.5 61.3 L117.5 63.0 L120.5 64.5 L123.5 65.4 L126.5 66.4 L129.5 66.9 L132.5 67.1 L135.5 66.7 L138.5 66.2 L141.5 65.3 L144.5 64.0 L147.5 62.3 L148.3 63.0 L147.5 63.7 L144.5 66.6 L141.5 69.6 L138.5 71.7 L135.5 73.3 L132.5 74.4 L129.5 75.1 L126.5 75.5 L123.5 75.3 L120.5 74.8 L117.5 74.0 L114.5 72.9 L111.5 71.4 L108.5 70.0 L105.5 68.3 L102.5 66.9 L99.5 65.5 L96.5 64.6 L93.5 63.8 L90.5 63.6 L87.5 63.6 L84.5 63.7 L81.5 64.4 L78.5 65.1 L75.5 66.4 L72.5 67.7 Z"/>
      </svg>
      <span class="brand-word">CoachCover</span>
    </a>
  </header>

  <main class="card" data-slot="offer">
    <div class="offer-head">
      <svg class="badge" viewBox="66.5 177 132 132" aria-hidden="true">
        <circle cx="132.5" cy="243" r="66.4" fill="var(--gold-soft)"/>
        <g fill="none" stroke="var(--gold)" stroke-linecap="round" stroke-linejoin="round">
          <rect x="100.3" y="216.8" width="64.4" height="59.9" rx="10" stroke-width="6.6"/>
          <line x1="100.3" y1="234" x2="164.7" y2="234" stroke-width="6"/>
          <line x1="116.5" y1="207.2" x2="116.5" y2="221" stroke-width="7.2"/>
          <line x1="147.8" y1="207.2" x2="147.8" y2="221" stroke-width="7.2"/>
        </g>
        <g fill="var(--gold)">
          <circle cx="116.5" cy="247.6" r="3.7"/><circle cx="132.2" cy="247.6" r="3.7"/><circle cx="147.8" cy="247.6" r="3.7"/>
          <circle cx="116.5" cy="261.6" r="3.7"/><circle cx="132.2" cy="261.6" r="3.7"/><circle cx="147.8" cy="261.6" r="3.7"/>
        </g>
      </svg>
      <h1 class="ask">
        <span class="line">Can you cover</span>
        <span class="line"><span class="time" data-slot="shift-window"><span data-slot="shift-start"></span><span class="dash">–</span><span data-slot="shift-end"></span></span> <span data-slot="shift-day"></span>?</span>
      </h1>
    </div>

    <div class="where">
      <svg class="pin" viewBox="89 373 33 42" aria-hidden="true">
        <path fill="var(--pin)" fill-rule="evenodd" d="M105.3 414.6 C100.5 408.2 89.5 400 89.5 390 A15.8 15.8 0 0 1 121.1 390 C121.1 400 110.1 408.2 105.3 414.6 Z M105.4 382.1 A7.2 7.2 0 1 0 105.4 396.5 A7.2 7.2 0 1 0 105.4 382.1 Z"/>
      </svg>
      <p class="where-text"><span data-slot="venue"></span> · <span data-slot="shift-detail"></span></p>
    </div>

    <div class="rule rule-1"></div>

    <h2 class="why-title">Why you</h2>
    <ul class="why-list" data-slot="why-list"></ul>

    <div class="rule rule-2"></div>

    <div class="timer" role="timer" aria-live="off">
      <svg viewBox="393.5 902.3 286 286" aria-hidden="true">
        <circle cx="536.5" cy="1045.3" r="137.3" fill="none" stroke="var(--track)" stroke-width="11.5"/>
        <circle data-slot="expires-ring" cx="536.5" cy="1045.3" r="137.3" fill="none" stroke="var(--gold)" stroke-width="11.5" transform="rotate(-90 536.5 1045.3)" stroke-dasharray="0 862.7"/>
      </svg>
      <div class="timer-label">Offer expires in</div>
      <div class="timer-value" data-slot="expires-in"></div>
    </div>
  </main>

  <footer class="actions">
    <div class="buttons" id="buttons">
      <button class="btn btn-accept" type="button" data-action="accept">Accept</button>
      <button class="btn btn-decline" type="button" data-action="decline">Decline</button>
    </div>
    <div class="result" id="result" role="status" hidden></div>
    <p class="sent-by">Sent by CoachCover for <span data-slot="manager-name"></span>, <span data-slot="manager-role"></span></p>
  </footer>
</div>

<script src="assets/api.js"></script>
<script src="assets/offer.js"></script>
</body>
</html>
