# CoachCover: db + api + worker; caddy (HTTPS in front) runs with the "edge" profile on the server.
#   local:  POSTGRES_PASSWORD=... docker compose up -d --build
#   server: docker compose --profile edge up -d --build   (values in .env, see .env.example)
# Live models: COACHCOVER_MODEL_MODE=live and VULTR_INFERENCE_API_KEY from the shell environment, never a file.
name: coachcover

x-app-env: &app-env
  DATABASE_URL: postgresql://coachcover:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/coachcover
  COACHCOVER_MODEL_MODE: ${COACHCOVER_MODEL_MODE:-replay}
  VULTR_INFERENCE_API_KEY: ${VULTR_INFERENCE_API_KEY:-}
  COACHCOVER_JUDGE_RUNS_PER_HOUR: ${COACHCOVER_JUDGE_RUNS_PER_HOUR:-6}
  # two agents on two addresses: Riverside (V1) on the api service, Northside (N1) on agent-north (A2A 1.0)
  COACHCOVER_A2A_PEERS: '{"V1": "http://api:8000/a2a/V1", "N1": "http://agent-north:8000/a2a/N1"}'
  COACHCOVER_SELF_URL: http://api:8000

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: coachcover
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: coachcover
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U coachcover -d coachcover"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build: .
    environment:
      <<: *app-env
      COACHCOVER_SEED_ON_START: "1"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8088}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Northside's agent: the same image on its own address, answering A2A for the lending venue
  agent-north:
    build: .
    environment:
      <<: *app-env
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "coachcover.worker"]
    environment:
      <<: *app-env
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2.8.4-alpine
    profiles: ["edge"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  caddy-data:
  caddy-config:
