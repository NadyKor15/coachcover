[project]
name = "coachcover"
version = "0.1.0"
description = "CoachCover: shift cover engine for teams with certifications"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2,<3.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "db: needs the local test Postgres (scripts/test-db-up.sh)",
]
