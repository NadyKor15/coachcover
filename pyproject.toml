[project]
name = "coachcover"
version = "0.1.0"
description = "CoachCover: shift cover engine for teams with certifications"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "fpdf2>=2.8,<3",
    "httpx>=0.27,<1",
    "mcp>=1.20,<2",
    "psycopg[binary]>=3.2,<3.3",
    "python-multipart>=0.0.17,<1",
    "uvicorn>=0.32,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "db: needs the local test Postgres (scripts/test-db-up.sh)",
]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
